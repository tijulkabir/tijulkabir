<text x="456" y="38" font-size="11" font-weight="600" fill="#7ee787" text-anchor="end">1ST ENGINEERING · 4TH OVERALL</text>
<text x="24" y="66" font-size="14" fill="#d4d4d4">Off-grid BLE mesh messenger</text>
<text x="456" y="66" font-size="11" fill="#8e8e8e" text-anchor="end">July National Hackathon 2026</text>
<path d="M24 84H456" stroke="#242424"/>
<text x="24" y="112" font-size="14" fill="#bfbfbf">Secure peer-to-peer messaging over Bluetooth</text>
<text x="24" y="135" font-size="14" fill="#bfbfbf">Low Energy mesh with multi-hop routing, private</text>
<text x="24" y="158" font-size="14" fill="#bfbfbf">DMs, and store-and-forward delivery. No internet.</text>
<text x="24" y="202" font-size="10" letter-spacing="1.5" fill="#8e8e8e">STACK &amp; DESIGN</text>
<text x="24" y="226" font-size="12.5" fill="#d4d4d4">Kotlin · Jetpack Compose · BLE mesh · MVVM</text>
<text x="24" y="247" font-size="12.5" fill="#d4d4d4">Noise Protocol · X25519 · AES-256-GCM</text>
