<svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" role="img" aria-labelledby="title desc">
<title id="title">Echo</title>
<desc id="desc">Off-grid BLE mesh messenger. 1st in Engineering Score and 4th Overall at July National Hackathon 2026. Secure peer-to-peer messaging over Bluetooth Low Energy mesh with multi-hop routing, end-to-end encryption, and store-and-forward delivery. Kotlin · Jetpack Compose · BLE mesh. Noise Protocol · X25519 · AES-256-GCM</desc>
<rect x="1" y="1" width="478" height="278" rx="12" fill="#080808" stroke="#2b2b2b"/>
<g font-family="Segoe UI,Arial,sans-serif">
